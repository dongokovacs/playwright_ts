name: Nightly Full Suite

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same pinned image as ci.yml: every project in playwright.config.ts is
    # Chromium-only, and the image already has it — the old
    # `npx playwright install --with-deps` downloaded all three browsers on
    # every run for nothing.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Run full suite
        id: run-tests
        # continue-on-error so the report still gets generated/published for
        # a red run — the job is failed explicitly at the end instead.
        continue-on-error: true
        run: npm test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Report flaky tests
        if: always()
        run: node scripts/report-flaky.js test-results/results.json

      - name: Upload Playwright report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Build Pages site (README landing page + report)
        if: always()
        run: |
          npm run build:pages
          cp -r playwright-report pages-site/report

      - name: Upload Playwright report (Pages artifact)
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site/

      - name: Fail the job if tests failed
        if: steps.run-tests.outcome != 'success'
        run: exit 1

  publish-report:
    needs: full-suite
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Shared with ci.yml's publish-report, so the two never deploy at once.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
